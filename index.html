# Replace Your `templates/index.html` With This Mobile-App Style Design

```html
<!DOCTYPE html>
<html>
<head>
    <title>My Weather.update</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(to bottom, #4facfe, #00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .phone{
            width:350px;
            background:white;
            border-radius:30px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
            text-align:center;
        }

        h1{
            margin-bottom:20px;
            color:#333;
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:15px;
            background:#f1f1f1;
            font-size:16px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:15px;
            background:#007bff;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#0056b3;
        }

        .weather-box{
            margin-top:25px;
            background:#f7f7f7;
            border-radius:20px;
            padding:20px;
        }

        .temp{
            font-size:50px;
            font-weight:bold;
            color:#333;
            margin-top:10px;
        }

        .desc{
            font-size:20px;
            color:#555;
            margin-top:10px;
            text-transform:capitalize;
        }

        .city{
            font-size:28px;
            color:#111;
        }

    </style>

</head>

<body>

    <div class="phone">

        <h1>My Weather.update</h1>

        <form method="POST">

            <input type="text" name="city" placeholder="Enter city name">

            <button type="submit">Get Weather</button>

        </form>

        {% if weather %}

        <div class="weather-box">

            <div class="city">{{ weather.city }}</div>

            <div class="temp">{{ weather.temperature }}°C</div>

            <div class="desc">{{ weather.description }}</div>

        </div>

        {% endif %}

    </div>

</body>
</html>
